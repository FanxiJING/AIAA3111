[project]
name = "mobility"
version = "0.1.0"
description = "GeoLife data preprocessing and pointwise feature engineering for model training handoff"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "pyarrow>=18"]

[project.scripts]
preprocess-labels = "data_preprocessing.label_matching:main"
preprocess-trips = "data_preprocessing.clean_trips:main"
filter-modes = "data_preprocessing.filter_modes:main"
build-features = "feature_enginneering.motion_features:main"
quality-features = "feature_enginneering.quality_features:main"
split-dataset = "data_preprocessing.split_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_preprocessing", "src/feature_enginneering"]

[tool.uv]
cache-dir = ".uv-cache"
